steps:
  # 1. ビルド
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/seo-app/backend-server:latest'
      - '.'

  # 2. プッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/seo-app/backend-server:latest'

  # 3. Cloud Run デプロイ
  #
  # クライアントマスタは Supabase の clients テーブル（CLIENT_STORE=supabase）。
  # 接続情報は Secret Manager の SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY。
  #
  # clients.json の Secret Manager マウントはロールバック用に残す。
  # 障害時は CLIENT_STORE=file に戻すだけで従来の JSON 運用に復帰できる。
  # マウント先を /secrets/ 配下にしているのは、/ 直下にマウントすると
  # 親ディレクトリがボリューム置換されコンテナが起動しなくなるため。
  #
  # PRODUCTION_DOMAIN は意図的に設定しない。CORS 実装がサブドメイン全許可型
  # のため、lishinc.com 配下の任意サブドメインから API を呼べてしまう。
  # 必要なオリジンは SEO_FRONTEND_URL / IMAGE_AGENT_URL で完全一致許可する。
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'backend-server'
      - '--image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/seo-app/backend-server:latest'
      - '--region=asia-northeast1'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--ingress=internal-and-cloud-load-balancing'
      - '--concurrency=1'
      - '--memory=2Gi'
      - '--timeout=3600'
      - '--max-instances=3'
      # ENABLE_CLIENTS_ADMIN: クライアント管理 API（/api/admin/*）のフィーチャーフラグ。既定 false。
      # 有効化する際は true に変更して再デプロイする（server/api/clients-admin.js）。
      - '--set-env-vars=CLIENT_STORE=supabase,CLIENTS_FILE=/secrets/clients.json,NODE_ENV=production,SEO_FRONTEND_URL=https://seo.lishinc.co.jp,IMAGE_AGENT_URL=https://imager.lishinc.co.jp,SLACK_WEBHOOK_URL=,ENABLE_CLIENTS_ADMIN=false'
      # 検索API: SERPER_API_KEY があれば Serper 優先、無ければ Google Custom Search にフォールバック（scraping-server.js /api/google-search）
      - '--set-secrets=INTERNAL_API_KEY=INTERNAL_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,SERPER_API_KEY=SERPER_API_KEY:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest,GOOGLE_SEARCH_ENGINE_ID=GOOGLE_SEARCH_ENGINE_ID:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,/secrets/clients.json=CLIENTS_JSON:latest,WP_USER_ENGLISH_WITH=WP_USER_ENGLISH_WITH:latest,WP_PASSWORD_ENGLISH_WITH=WP_PASSWORD_ENGLISH_WITH:latest'
      # clients.json が参照する WP_USER_*/WP_PASS_* も --set-secrets に追加が必要。
      # 実サイト確定後に以下の形式で追記すること（値は Secret Manager に登録）:
      #   WP_USER_LISH_CORP=WP_USER_LISH_CORP:latest,WP_PASS_LISH_CORP=WP_PASS_LISH_CORP:latest

images:
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/seo-app/backend-server:latest'
