# BACKEND_URL は本番では空文字。LB の URL マップで各サブドメインの
# /api/* が backend-server にルーティングされるため、
# フロントは自オリジンの /api を叩く（同一オリジン＝CORS 不要、
# IAP セッションクッキーも有効）。絶対URLを入れてはいけない。
steps:
  # 1. ビルド
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      # Secret 経由: GEMINI_API_KEY / INTERNAL_API_KEY（秘密値）
      # リテラル: BACKEND_URL=""（同一オリジン）
      #   MAIN_APP_URL=https://seo.lishinc.co.jp（postMessage の送受信に使う親アプリの絶対オリジン）
      #   BASE_PATH=/（imager.lishinc.co.jp のサブドメイン配信のためルート）
      #   ENABLE_SLACK_NOTIFICATIONS=false（seo-frontend と同じく本番では無効化）
      - >-
        docker build
        --build-arg VITE_GEMINI_API_KEY=$$GEMINI_API_KEY
        --build-arg VITE_BACKEND_URL=
        --build-arg VITE_INTERNAL_API_KEY=$$INTERNAL_API_KEY
        --build-arg VITE_MAIN_APP_URL=https://seo.lishinc.co.jp
        --build-arg VITE_BASE_PATH=/
        --build-arg VITE_ENABLE_SLACK_NOTIFICATIONS=false
        -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/seo-app/ai-article-imager:latest .
    secretEnv:
      - GEMINI_API_KEY
      - INTERNAL_API_KEY

  # 2. プッシュ
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-northeast1-docker.pkg.dev/$PROJECT_ID/seo-app/ai-article-imager:latest

  # 3. Cloud Run デプロイ（nginx 静的配信、Secret 不要）
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ai-article-imager
      - '--image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/seo-app/ai-article-imager:latest'
      - '--region=asia-northeast1'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--ingress=internal-and-cloud-load-balancing'
      - '--memory=512Mi'
      - '--cpu=1'

images:
  - asia-northeast1-docker.pkg.dev/$PROJECT_ID/seo-app/ai-article-imager:latest
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GEMINI_API_KEY/versions/latest
      env: GEMINI_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/INTERNAL_API_KEY/versions/latest
      env: INTERNAL_API_KEY
